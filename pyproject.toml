[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vine-harness"
version = "0.1.0"
description = "Lightweight AI Agent Harness fusing Trellis lifecycle & hooks, Ponytail pragmatism, and grill-with-docs Socratic brainstorming"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vine Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
vine = "vine.cli:main"

[tool.setuptools.packages.find]
include = ["vine*"]

# Prompt text, hook scripts and the Pi extension ship as package data so that
# `pip install` produces a working CLI, not an install that is missing its assets.
[tool.setuptools.package-data]
"vine.assets" = [
    "*.md",
    "*.js",
    "hooks/*.py",
    "skills/*/*.md",
]
